name: kotonoha-supabase

services:
  db:
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    ports:
      - "127.0.0.1:54322:5432"
    environment:
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_PORT: "5432"
      PGPORT: "5432"
      POSTGRES_DB: postgres
      PGDATABASE: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run manage.py prepare first}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Run manage.py prepare first}
      SUPABASE_AUTH_DB_PASSWORD: ${SUPABASE_AUTH_DB_PASSWORD:?Run manage.py prepare first}
    volumes:
      - database:/var/lib/postgresql/data
      - database-config:/etc/postgresql-custom
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-scripts/99-kotonoha-auth.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_min_messages=fatal"]

  auth:
    image: supabase/gotrue:v2.197.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:54321:9999"
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: ${API_EXTERNAL_URL:?Run manage.py prepare first}
      GOTRUE_SITE_URL: ${SITE_URL:?Run manage.py prepare first}
      GOTRUE_URI_ALLOW_LIST: ${SITE_URL:?Run manage.py prepare first}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${SUPABASE_AUTH_DB_PASSWORD}@db:5432/postgres
      GOTRUE_DB_MAX_POOL_SIZE: "10"
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?Run manage.py prepare first}
      GOTRUE_JWT_ISSUER: ${API_EXTERNAL_URL:?Run manage.py prepare first}
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: "false"
      GOTRUE_PASSWORD_MIN_LENGTH: "12"
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
      GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: "10"
      # SMTP is intentionally unconfigured. Accounts are created through the
      # loopback-only administration script, with email_confirm=true.
      LOG_LEVEL: warn
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  database:
  database-config:
